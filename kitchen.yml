---
driver:
  name: vagrant

verifier:
  name: inspec

transport:
  name: rsync

provisioner:
  name: cinc_infra
  product_version: '19'
  enforce_idempotency: true
  multiple_converge: 2
  deprecations_as_errors: true
  attributes:
    osl-selinux:
      enforcing: true

platforms:
  - name: almalinux-8

suites:
  - name: default
    run_list:
      - recipe[osl-acme::default]
  - name: server
    run_list:
      - recipe[osl-acme::server]
      - recipe[acme_test]
    attributes:
      osl-acme:
        pebble:
          host_aliases:
            - foo.org
